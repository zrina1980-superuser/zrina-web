name: Publish scheduled blog posts

on:
  schedule:
    - cron: "0 6,7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check whether it is 08:00 in Zagreb
        id: schedule
        run: node scripts/blog-publish-due.js >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.schedule.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Build site
        if: steps.schedule.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Check Cloudflare credentials
        if: steps.schedule.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }

      - name: Publish to Cloudflare Pages
        if: steps.schedule.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: npx wrangler pages deploy dist --project-name zrina-app-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
